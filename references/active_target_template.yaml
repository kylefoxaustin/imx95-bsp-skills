# active_target.yaml — Template
#
# This file is written to <workspace>/targets/active_target.yaml by
# imx95-init-target or imx95-set-target.
#
# It is either a direct copy of a named profile YAML, or a symlink to one.
# All skills read this file to determine the active board configuration.
#
# DO NOT edit this file directly. Instead:
